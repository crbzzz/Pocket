name: Pocket checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:preview
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/ios/PocketCore
      - run: xcodebuild -project apps/ios/Pocket.xcodeproj -scheme Pocket -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
